<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>PC Bang Control</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    :root {
      --bg: #0a0a0f;
      --surface: #13131a;
      --border: #1e1e2e;
      --accent: #3b82f6;
      --accent-dim: rgba(59,130,246,0.15);
      --danger: #ef4444;
      --danger-dim: rgba(239,68,68,0.15);
      --green: #22c55e;
      --text: #e2e8f0;
      --muted: #64748b;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
      min-height: 100dvh;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    /* HEADER */
    .header {
      padding: 20px 20px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .header-sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }
    .refresh-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      width: 38px; height: 38px;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s;
    }
    .refresh-btn:active { background: var(--border); }
    .refresh-btn.spinning { animation: spin 0.6s linear; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* STATUS BAR */
    .status-bar {
      margin: 16px 20px 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .status-count {
      display: flex;
      gap: 20px;
    }
    .count-item { text-align: center; }
    .count-num {
      font-size: 24px;
      font-weight: 700;
      line-height: 1;
    }
    .count-num.green { color: var(--green); }
    .count-num.muted { color: var(--muted); }
    .count-label { font-size: 11px; color: var(--muted); margin-top: 3px; }

    .last-update {
      font-size: 11px;
      color: var(--muted);
      text-align: right;
    }

    /* ALL SHUTDOWN BUTTON */
    .all-btn-wrap {
      padding: 14px 20px 0;
    }
    .all-shutdown-btn {
      width: 100%;
      background: var(--danger-dim);
      border: 1px solid var(--danger);
      color: var(--danger);
      border-radius: 14px;
      padding: 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .all-shutdown-btn:active { background: rgba(239,68,68,0.3); transform: scale(0.98); }
    .all-shutdown-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* PC LIST */
    .section-label {
      padding: 18px 20px 10px;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .pc-list {
      padding: 0 20px 30px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .pc-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      transition: border-color 0.2s;
    }
    .pc-card.online { border-color: rgba(34,197,94,0.3); }

    .pc-info {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
    }

    .pc-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
    }
    .pc-dot.online {
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .pc-name {
      font-size: 16px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .pc-status {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }
    .pc-status.online { color: var(--green); }

    .shutdown-btn {
      background: var(--danger-dim);
      border: 1px solid rgba(239,68,68,0.4);
      color: var(--danger);
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s, transform 0.1s;
      flex-shrink: 0;
    }
    .shutdown-btn:active { background: rgba(239,68,68,0.3); transform: scale(0.95); }
    .shutdown-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .shutdown-btn.sent {
      background: rgba(239,68,68,0.05);
      border-color: rgba(239,68,68,0.2);
      color: var(--muted);
    }

    /* EMPTY / LOADING */
    .empty {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
    }
    .empty-icon { font-size: 36px; margin-bottom: 10px; }
    .empty-text { font-size: 14px; }

    /* CONFIRM MODAL */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      display: flex; align-items: flex-end; justify-content: center;
      padding: 0 16px 32px;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .modal-overlay.show { opacity: 1; pointer-events: all; }
    .modal {
      background: #1a1a28;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px 20px 20px;
      width: 100%;
      max-width: 400px;
      transform: translateY(20px);
      transition: transform 0.2s;
    }
    .modal-overlay.show .modal { transform: translateY(0); }
    .modal-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
    .modal-desc { font-size: 14px; color: var(--muted); margin-bottom: 20px; line-height: 1.5; }
    .modal-btns { display: flex; gap: 10px; }
    .modal-cancel {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 12px;
      padding: 13px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    .modal-confirm {
      flex: 1;
      background: var(--danger);
      border: none;
      color: white;
      border-radius: 12px;
      padding: 13px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    .modal-confirm:active { opacity: 0.85; }

    /* TOAST */
    .toast {
      position: fixed;
      top: 60px; left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: #1e1e2e;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 10px 18px;
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.2s, transform 0.2s;
      z-index: 200;
      pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* SETUP SCREEN */
    .setup {
      padding: 40px 24px;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .setup-title { font-size: 26px; font-weight: 700; margin-bottom: 8px; }
    .setup-sub { font-size: 14px; color: var(--muted); margin-bottom: 32px; line-height: 1.6; }
    .setup-label { font-size: 13px; color: var(--muted); margin-bottom: 8px; font-weight: 500; }
    .setup-input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 14px;
      outline: none;
      margin-bottom: 20px;
      -webkit-appearance: none;
    }
    .setup-input:focus { border-color: var(--accent); }
    .setup-btn {
      width: 100%;
      background: var(--accent);
      border: none;
      color: white;
      border-radius: 14px;
      padding: 15px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 4px;
    }
    .setup-btn:active { opacity: 0.85; }
  </style>
</head>
<body>

<!-- SETUP SCREEN -->
<div class="setup" id="setupScreen">
  <div class="setup-title">⚙️ Тохиргоо</div>
  <div class="setup-sub">Нэг удаа Firebase URL-аа оруулбал хадгалагдаад дахин асуухгүй.</div>
  <div class="setup-label">Firebase Realtime Database URL</div>
  <input class="setup-input" type="url" id="urlInput"
    placeholder="https://your-project-default-rtdb.region.firebasedatabase.app"
    autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
  <button class="setup-btn" onclick="saveUrl()">Холбогдох →</button>
</div>

<!-- MAIN SCREEN -->
<div id="mainScreen" style="display:none;">
  <div class="header">
    <div>
      <div class="header-title">PC Bang</div>
      <div class="header-sub" id="headerSub">Холбогдож байна...</div>
    </div>
    <button class="refresh-btn" id="refreshBtn" onclick="refresh()">↻</button>
  </div>

  <div class="status-bar">
    <div class="status-count">
      <div class="count-item">
        <div class="count-num green" id="onlineCount">—</div>
        <div class="count-label">ONLINE</div>
      </div>
      <div class="count-item">
        <div class="count-num muted" id="totalCount">—</div>
        <div class="count-label">НИЙТ</div>
      </div>
    </div>
    <div class="last-update" id="lastUpdate">—</div>
  </div>

  <div class="all-btn-wrap">
    <button class="all-shutdown-btn" id="allBtn" onclick="confirmAll()">
      ⏻ Бүгдийг унтраах
    </button>
  </div>

  <div class="section-label">КОМПЬЮТЕРҮҮД</div>

  <div class="pc-list" id="pcList">
    <div class="empty">
      <div class="empty-icon">⏳</div>
      <div class="empty-text">Уншиж байна...</div>
    </div>
  </div>
</div>

<!-- CONFIRM MODAL -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-title" id="modalTitle">Бүгдийг унтраах уу?</div>
    <div class="modal-desc" id="modalDesc">Online байгаа бүх PC-г force shutdown хийнэ.</div>
    <div class="modal-btns">
      <button class="modal-cancel" onclick="closeModal()">Болих</button>
      <button class="modal-confirm" id="modalConfirm" onclick="doConfirm()">Унтраах</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
  const ONLINE_TIMEOUT = 15; // секунд
  let FIREBASE_URL = '';
  let allPcData = {};
  let confirmTarget = null; // null = all, string = pc name
  let autoRefreshTimer = null;

  // ── SETUP ──────────────────────────────────────────
  function init() {
    const saved = localStorage.getItem('pcbang_url');
    if (saved) {
      FIREBASE_URL = saved;
      showMain();
    } else {
      document.getElementById('setupScreen').style.display = '';
    }
  }

  function saveUrl() {
    const val = document.getElementById('urlInput').value.trim().replace(/\/$/, '');
    if (!val.startsWith('https://')) {
      showToast('⚠️ URL буруу байна');
      return;
    }
    localStorage.setItem('pcbang_url', val);
    FIREBASE_URL = val;
    showMain();
  }

  function showMain() {
    document.getElementById('setupScreen').style.display = 'none';
    document.getElementById('mainScreen').style.display = '';
    loadPCs();
    startAutoRefresh();
  }

  // ── FIREBASE ────────────────────────────────────────
  async function fbGet(path) {
    const res = await fetch(`${FIREBASE_URL}/${path}.json`);
    if (!res.ok) throw new Error('Firebase алдаа');
    return res.json();
  }

  async function fbPut(path, value) {
    const res = await fetch(`${FIREBASE_URL}/${path}.json`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(value)
    });
    if (!res.ok) throw new Error('Firebase бичих алдаа');
    return res.json();
  }

  // ── LOAD ────────────────────────────────────────────
  async function loadPCs() {
    try {
      const data = await fbGet('pcs');
      allPcData = data || {};
      renderPCs();
    } catch (e) {
      document.getElementById('pcList').innerHTML = `
        <div class="empty">
          <div class="empty-icon">⚠️</div>
          <div class="empty-text">Firebase-тай холбогдож чадсангүй<br>URL шалгана уу</div>
        </div>`;
      document.getElementById('headerSub').textContent = 'Холбогдохгүй байна';
    }
  }

  function renderPCs() {
    const now = Math.floor(Date.now() / 1000);
    const names = Object.keys(allPcData).sort((a, b) => natSort(a, b));
    
    let onlineCount = 0;
    let html = '';

    names.forEach(name => {
      const d = allPcData[name];
      const lastSeen = d?.last_seen || 0;
      const isOnline = (now - lastSeen) < ONLINE_TIMEOUT;
      if (isOnline) onlineCount++;

      const ago = isOnline ? 'Идэвхтэй' : lastSeen ? timeAgo(now - lastSeen) + ' өмнө' : 'Мэдээлэл алга';

      html += `
        <div class="pc-card ${isOnline ? 'online' : ''}">
          <div class="pc-info">
            <div class="pc-dot ${isOnline ? 'online' : ''}"></div>
            <div>
              <div class="pc-name">${name}</div>
              <div class="pc-status ${isOnline ? 'online' : ''}">${ago}</div>
            </div>
          </div>
          ${isOnline ? `
            <button class="shutdown-btn" id="btn-${name}" onclick="confirmOne('${name}')">
              ⏻ Унтраах
            </button>` : ''}
        </div>`;
    });

    if (names.length === 0) {
      html = `<div class="empty">
        <div class="empty-icon">🖥️</div>
        <div class="empty-text">PC бүртгэгдээгүй байна<br>pc_agent.exe ажиллуулна уу</div>
      </div>`;
    }

    document.getElementById('pcList').innerHTML = html;
    document.getElementById('onlineCount').textContent = onlineCount;
    document.getElementById('totalCount').textContent = names.length;
    document.getElementById('headerSub').textContent = `${onlineCount} PC онлайн`;

    const now2 = new Date();
    document.getElementById('lastUpdate').textContent =
      `Шинэчлэгдсэн\n${now2.getHours()}:${String(now2.getMinutes()).padStart(2,'0')}:${String(now2.getSeconds()).padStart(2,'0')}`;

    document.getElementById('allBtn').disabled = (onlineCount === 0);
  }

  // ── REFRESH ─────────────────────────────────────────
  function refresh() {
    const btn = document.getElementById('refreshBtn');
    btn.classList.add('spinning');
    loadPCs().finally(() => {
      setTimeout(() => btn.classList.remove('spinning'), 600);
    });
  }

  function startAutoRefresh() {
    clearInterval(autoRefreshTimer);
    autoRefreshTimer = setInterval(() => loadPCs(), 8000);
  }

  // ── CONFIRM MODAL ───────────────────────────────────
  function confirmOne(name) {
    confirmTarget = name;
    document.getElementById('modalTitle').textContent = `${name.toUpperCase()} унтраах уу?`;
    document.getElementById('modalDesc').textContent = `${name.toUpperCase()} компьютерийг force shutdown хийнэ.`;
    openModal();
  }

  function confirmAll() {
    confirmTarget = null;
    const count = parseInt(document.getElementById('onlineCount').textContent) || 0;
    document.getElementById('modalTitle').textContent = `Бүгдийг унтраах уу?`;
    document.getElementById('modalDesc').textContent = `Online байгаа ${count} PC-г бүгдийг force shutdown хийнэ.`;
    openModal();
  }

  function openModal() {
    document.getElementById('modal').classList.add('show');
  }

  function closeModal() {
    document.getElementById('modal').classList.remove('show');
  }

  async function doConfirm() {
    closeModal();
    if (confirmTarget) {
      await shutdownOne(confirmTarget);
    } else {
      await shutdownAll();
    }
  }

  // ── SHUTDOWN ─────────────────────────────────────────
  async function shutdownOne(name) {
    try {
      await fbPut(`pcs/${name}/shutdown`, true);
      const btn = document.getElementById(`btn-${name}`);
      if (btn) {
        btn.textContent = '✓ Илгээгдлээ';
        btn.classList.add('sent');
        btn.disabled = true;
      }
      showToast(`✓ ${name.toUpperCase()} унтраана`);
    } catch (e) {
      showToast(`⚠️ ${name} алдаа гарлаа`);
    }
  }

  async function shutdownAll() {
    const now = Math.floor(Date.now() / 1000);
    const names = Object.keys(allPcData).filter(name => {
      const d = allPcData[name];
      return (now - (d?.last_seen || 0)) < ONLINE_TIMEOUT;
    });

    document.getElementById('allBtn').disabled = true;
    document.getElementById('allBtn').textContent = '⏳ Илгээж байна...';

    let sent = 0;
    for (const name of names) {
      try {
        await fbPut(`pcs/${name}/shutdown`, true);
        sent++;
      } catch (e) {}
    }

    showToast(`✓ ${sent} PC-д команд илгээгдлээ`);
    document.getElementById('allBtn').textContent = '⏻ Бүгдийг унтраах';

    setTimeout(() => loadPCs(), 3000);
  }

  // ── TOAST ────────────────────────────────────────────
  let toastTimer;
  function showToast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
  }

  // ── UTILS ────────────────────────────────────────────
  function natSort(a, b) {
    return a.replace(/\d+/, n => n.padStart(5, '0'))
           .localeCompare(b.replace(/\d+/, n => n.padStart(5, '0')));
  }

  function timeAgo(sec) {
    if (sec < 60) return `${sec}с`;
    if (sec < 3600) return `${Math.floor(sec/60)}м`;
    return `${Math.floor(sec/3600)}ц`;
  }

  // Modal гадна дарвал хаах
  document.getElementById('modal').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });

  init();
</script>
</body>
</html>
